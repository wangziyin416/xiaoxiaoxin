name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh
          ditto -c -k --sequesterRsrc --keepParent "dist/小小信.app" "dist/xiaoxiaoxin-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoxiaoxin-macos
          path: dist/xiaoxiaoxin-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish Windows portable build
        shell: pwsh
        run: |
          dotnet publish windows/XiaoXiaoXin/XiaoXiaoXin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/windows
          Compress-Archive -Path dist/windows/* -DestinationPath dist/xiaoxiaoxin-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoxiaoxin-windows-x64
          path: dist/xiaoxiaoxin-Windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
